<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TicketNow — realtime notifications</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.7/signalr.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 680px; margin: 40px auto; padding: 0 16px; }
    input, button { font: inherit; padding: 8px; }
    input { width: 100%; box-sizing: border-box; margin-bottom: 8px; }
    #status { padding: 8px 12px; border-radius: 6px; background: #F1EFE8; display: inline-block; }
    .item { border-left: 3px solid #1D9E75; padding: 8px 12px; margin: 12px 0; background: #F1EFE8; }
    .item small { color: #5F5E5A; }
  </style>
</head>
<body>
  <h1>Realtime notifications</h1>
  <input id="token" placeholder="Paste an access token here">
  <input id="url" value="/hubs/notifications">
  <button onclick="connect()">Connect</button>
  <p id="status">Not connected</p>
  <div id="list"></div>

  <script>
    let conn;
    async function connect() {
      const token = document.getElementById('token').value.trim();
      if (!token) return alert('An access token is required');
      if (conn) await conn.stop();

      conn = new signalR.HubConnectionBuilder()
        .withUrl(document.getElementById('url').value, { accessTokenFactory: () => token })
        .withAutomaticReconnect()
        .build();

      conn.on('notification', n => {
        const el = document.createElement('div');
        el.className = 'item';
        el.innerHTML = `<strong>${n.title}</strong><br>${n.message}<br>
                        <small>${n.kind} · ${new Date(n.createdAt).toLocaleTimeString('en-US')}</small>`;
        document.getElementById('list').prepend(el);
      });

      conn.onreconnecting(() => setStatus('Reconnecting...'));
      conn.onreconnected(() => setStatus('Connected'));
      conn.onclose(() => setStatus('Disconnected'));

      try { await conn.start(); setStatus('Connected'); }
      catch (e) { setStatus('Error: ' + e.message); }
    }
    function setStatus(t) { document.getElementById('status').textContent = t; }
  </script>
</body>
</html>

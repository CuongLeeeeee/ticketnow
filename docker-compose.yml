name: ticketnow

services:
  postgres:
    image: postgres:16-alpine
    container_name: tn-postgres
    environment:
      POSTGRES_USER: ticketnow
      POSTGRES_PASSWORD: ticketnow
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketnow -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tn-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: tn-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ticketnow
      RABBITMQ_DEFAULT_PASS: ticketnow
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: tn-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: tn-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
  gateway:
    profiles: ["app"]
    build:
      context: .
      args: { PROJECT: src/ApiGateway/TicketNow.Gateway, DLL: TicketNow.Gateway.dll }
    environment:
      <<: &common
        ASPNETCORE_ENVIRONMENT: Development
        Jwt__Issuer: ticketnow-identity
        Jwt__Audience: ticketnow-api
        Jwt__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY is missing from .env}
        Otlp__Endpoint: http://jaeger:4317
        RabbitMq__Host: rabbitmq
        RabbitMq__Username: ticketnow
        RabbitMq__Password: ticketnow
      ReverseProxy__Clusters__identity__Destinations__d1__Address: http://identity:8080/
      ReverseProxy__Clusters__catalog__Destinations__d1__Address: http://catalog:8080/
      ReverseProxy__Clusters__booking__Destinations__d1__Address: http://booking:8080/
      ReverseProxy__Clusters__payment__Destinations__d1__Address: http://payment:8080/
      ReverseProxy__Clusters__notification__Destinations__d1__Address: http://notification:8080/
      RateLimit__LoginPerMinute: 20
    ports: ["5000:8080"]
    depends_on: [identity, catalog, booking, payment, notification]

  identity:
    profiles: ["app"]
    build:
      context: .
      args: { PROJECT: src/Services/Identity/TicketNow.Identity.Api, DLL: TicketNow.Identity.Api.dll }
    environment:
      <<: *common
      ConnectionStrings__Postgres: Host=postgres;Database=ticketnow_identity;Username=ticketnow;Password=ticketnow
      SeedAdmin__Email: admin@ticketnow.local
      SeedAdmin__Password: ${SEED_ADMIN_PASSWORD:?SEED_ADMIN_PASSWORD is missing from .env}
    depends_on: &infra
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }

  catalog:
    profiles: ["app"]
    build:
      context: .
      args: { PROJECT: src/Services/Catalog/TicketNow.Catalog.Api, DLL: TicketNow.Catalog.Api.dll }
    environment:
      <<: *common
      ConnectionStrings__Postgres: Host=postgres;Database=ticketnow_catalog;Username=ticketnow;Password=ticketnow
      ConnectionStrings__Redis: redis:6379
    depends_on: *infra

  booking:
    profiles: ["app"]
    build:
      context: .
      args: { PROJECT: src/Services/Booking/TicketNow.Booking.Api, DLL: TicketNow.Booking.Api.dll }
    environment:
      <<: *common
      ConnectionStrings__Postgres: Host=postgres;Database=ticketnow_booking;Username=ticketnow;Password=ticketnow
      ConnectionStrings__Redis: redis:6379
      Booking__HoldMinutes: 10
    depends_on: *infra

  payment:
    profiles: ["app"]
    build:
      context: .
      args: { PROJECT: src/Services/Payment/TicketNow.Payment.Api, DLL: TicketNow.Payment.Api.dll }
    environment:
      <<: *common
      ConnectionStrings__Postgres: Host=postgres;Database=ticketnow_payment;Username=ticketnow;Password=ticketnow
      Payment__SimulatedFailureRate: 0.2
    depends_on: *infra

  notification:
    profiles: ["app"]
    build:
      context: .
      args: { PROJECT: src/Services/Notification/TicketNow.Notification.Api, DLL: TicketNow.Notification.Api.dll }
    environment:
      <<: *common
      ConnectionStrings__Redis: redis:6379
      Email__Host: mailhog
      Email__Port: 1025
    ports: ["5005:8080"]
    depends_on: *infra

volumes:
  pgdata:
  redisdata:
  rabbitdata: